name: Update RSS Feed & Deploy to GitHub Pages

on:
  schedule:
    # Her sabah Türkiye saati ile 10:00'da (07:00 UTC) günlük podcast ve bülten yayını
    - cron: "0 7 * * *"
    # Gün içi periyodik haber taramaları
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      force_podcast:
        description: 'Podcast ve WhatsApp bültenini çalıştır'
        type: boolean
        default: true
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore Podcast Episodes Audio Cache
        uses: actions/cache@v4
        with:
          path: |
            data/episodes/
          key: podcast-episodes-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            podcast-episodes-${{ runner.os }}-

      - name: Generate Static RSS Feed & Portal
        env:
          INOREADER_URL: "https://www.inoreader.com/stream/user/1006125058/tag/SU/view/html?cs=m"
          PUBLIC_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          ENABLE_PODCAST: ${{ (github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_podcast == 'true')) && 'true' || 'false' }}
          GREEN_API_INSTANCE_ID: ${{ secrets.GREEN_API_INSTANCE_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          WHATSAPP_CHAT_ID: ${{ secrets.WHATSAPP_CHAT_ID }}
          WHATSAPP_WEBHOOK_URL: ${{ secrets.WHATSAPP_WEBHOOK_URL }}
        run: |
          python export_static.py

      - name: Commit & Push Updated Data to Repository
        if: github.event.schedule == '0 7 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_podcast == 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed_items.db data/podcast_episodes.json data/episodes/*.mp3 data/whatsapp_history.json data/sygm_last_report_url.txt data/sygm_sync_history.json || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): sync sqlite & podcast metadata [skip ci]"
            git pull --rebase origin main || true
            git push origin main || echo "Git push skipped"
          else
            echo "No data changes to commit"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
